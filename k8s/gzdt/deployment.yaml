apiVersion: apps/v1
kind: Deployment
metadata:
  name: arthas-demo-service
  # LAN overlay: deploy into the EXISTING gzdt namespace.
  # This file deliberately does NOT create a namespace and does NOT
  # touch any other Deployment/Service in gzdt.
  namespace: gzdt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arthas-demo-service
  template:
    metadata:
      labels:
        app: arthas-demo-service
    spec:
      containers:
        - name: arthas-demo-service
          # Published by .github/workflows/publish.yml to GHCR.
          # If the GHCR package is private, anonymous pulls fail (401);
          # make the package public, or add an imagePullSecret, before
          # applying this manifest on a LAN cluster.
          image: ghcr.io/xywhnh/arthas-mcp-demo:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
