apiVersion: apps/v1
kind: Deployment
metadata:
  name: arthas-demo-service
  # LAN overlay: deploy into the EXISTING gzdt namespace.
  # This file deliberately does NOT create a namespace and does NOT
  # touch any other Deployment/Service in gzdt.
  namespace: gzdt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arthas-demo-service
  template:
    metadata:
      labels:
        app: arthas-demo-service
    spec:
      containers:
        - name: arthas-demo-service
          # Published by .github/workflows/publish.yml to GHCR (tag 0.1.0
          # is rebuilt on every Publish, so Always pull: otherwise a node
          # that cached an older 0.1.0 would keep running the old image).
          # The GHCR package is public (verified 2026-10-28), so LAN nodes
          # pull it anonymously; no imagePullSecret is needed.
          image: ghcr.io/xywhnh/arthas-mcp-demo:0.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            # timeoutSeconds default is 1s: too tight for a Java app on a
            # slow node / under fault load, and it caused spurious
            # "Client.Timeout exceeded while awaiting headers" failures
            # even though /api/orders responded fine.
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
