# NodePort for the MCP server, gzdt only.
# No nodePort is specified: the cluster assigns one automatically
# (like arthas-demo-service got 32320). Read the assigned port from
# the Service in Dashboard, then use it as
# http://10.129.73.14:<assigned-port>/mcp from your own machine.
# Keep this LAN-only: /mcp is Bearer-token protected, but it is still
# a window into JVMs and must never be exposed publicly.
# Upload order in Dashboard: 6 of 6.
apiVersion: v1
kind: Service
metadata:
  name: arthas-mcp-server
  namespace: gzdt
spec:
  type: NodePort
  selector:
    app: arthas-mcp-server
  ports:
    - protocol: TCP
      port: 18080
      targetPort: 18080
