# MCP Bearer token. REPLACE the placeholder below with a real secret
# BEFORE uploading, and never commit a real token to the repo.
# The Deployment reads this Secret; the client then sends it as
# Authorization: Bearer <that token> to /mcp. Without it, /mcp returns 401.
# Upload order in Dashboard: 4 of 6.
apiVersion: v1
kind: Secret
metadata:
  name: arthas-mcp-token
  namespace: gzdt
type: Opaque
stringData:
  token: "REPLACE-ME-WITH-A-SECRET"
