# KIND / CI ONLY -- DO NOT upload this file to a LAN or shared cluster.
# For the LAN gzdt deployment, use k8s/gzdt/deployment.yaml + k8s/gzdt/service.yaml instead
# (namespace gzdt, object name arthas-demo-service, GHCR image).
apiVersion: v1
kind: Service
metadata:
  name: demo-service
  namespace: demo-arthas
spec:
  selector:
    app: demo-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
