apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-service
  namespace: demo-arthas
spec:
  # 1 replica on purpose: fault toggles are per-Pod in-memory state.
  # With 1 replica, "before fault / after fault" is deterministic.
  # For a healthy-vs-slow two-Pod contrast, scale to 2 and port-forward
  # each Pod separately instead of going through the Service.
  replicas: 1
  selector:
    matchLabels:
      app: demo-service
  template:
    metadata:
      labels:
        app: demo-service
    spec:
      containers:
        - name: demo-service
          image: demo-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
