name: Publish MCP

# Build the MCP server image on GitHub and push it to GHCR, so a LAN
# cluster can run MCP as an independent Pod/Service without any host
# process. This is separate from Publish (the demo app image) and from
# CI (which builds but does not push).
#
# Image: ghcr.io/xywhnh/arthas-mcp-demo-mcp:0.1.0 (and :latest)
# Platforms: linux/amd64 and linux/arm64.
#
# Visibility: like the demo app image, this package must be public
# for LAN nodes to pull it anonymously. A new GHCR package starts
# private by default; after the first run, make it public or the
# gzdt MCP Deployment will ImagePullBackOff.
#
# Manifest format (critical for the LAN cluster): Docker v2, not OCI,
# for the same reason as the demo app image -- the old LAN runtime
# rejects OCI manifests. Same fix: oci-mediatypes=false AND
# provenance/sbom=false, plus the verify step below.
on:
  push:
    branches: [main]
    paths:
      - mcp/**
      - .github/workflows/publish-mcp.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MCP image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: |
            ghcr.io/xywhnh/arthas-mcp-demo-mcp:0.1.0
            ghcr.io/xywhnh/arthas-mcp-demo-mcp:latest

      - name: Verify pushed manifest is Docker v2 (not OCI)
        run: |
          python3 - << 'PY'
          import json, urllib.request
          repo = "xywhnh/arthas-mcp-demo-mcp"
          tok = json.load(urllib.request.urlopen(
              f"https://ghcr.io/token?service=ghcr.io&scope=repository:{repo}:pull"))["token"]
          def get(url, accept):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}", "Accept": accept})
              with urllib.request.urlopen(req) as r:
                  return r.headers.get("Content-Type", ""), r.read()
          ct, body = get(f"https://ghcr.io/v2/{repo}/manifests/0.1.0",
                         "application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json")
          print("index content-type:", ct)
          idx = json.loads(body)
          assert idx.get("mediaType") == "application/vnd.docker.distribution.manifest.list.v2+json", \
              f"index is not Docker manifest list v2: {idx.get('mediaType')}"
          plats = [(m["platform"]["architecture"], m["digest"]) for m in idx["manifests"]
                   if m.get("platform", {}).get("os") == "linux"]
          assert plats, "no linux platform manifests in index"
          for arch, digest in plats:
              ct2, body2 = get(f"https://ghcr.io/v2/{repo}/manifests/{digest}",
                               "application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json")
              m = json.loads(body2)
              print(f"{arch} {digest[:19]} mediaType={m.get('mediaType')} content-type={ct2}")
              assert m.get("mediaType") == "application/vnd.docker.distribution.manifest.v2+json", \
                  f"{arch} manifest is not Docker v2: {m.get('mediaType')}"
          print("OK: Docker v2 manifest list + Docker v2 per-arch manifests, no OCI-only index")
          PY
