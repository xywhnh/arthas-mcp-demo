name: CI

# Build the Java demo, build its Docker image, and smoke-test it on a
# throwaway kind cluster. This proves the exact artifact a presenter
# would run locally still builds and starts -- it does NOT deploy to
# any real cluster and does NOT touch production namespaces.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build demo-service jar
        run: mvn -B -pl apps/demo-service -am package -DskipTests

      - name: Build Docker image (no push)
        run: docker build -t demo-service:ci apps/demo-service

      - name: Build MCP server image (no push) and test its HTTP server
        run: |
          docker build -t arthas-mcp-server:ci -f mcp/Dockerfile .
          docker run -d --name mcp-ci -p 18099:18080 \
            -e MCP_AUTH_TOKEN=test-token-123 \
            -e ARTHAS_NAMESPACE=gzdt -e ARTHAS_ALLOWED_NAMESPACES=gzdt \
            arthas-mcp-server:ci
          trap 'docker rm -f mcp-ci >/dev/null 2>&1 || true' EXIT
          sleep 3
          curl -fsS http://localhost:18099/health
          echo
          # No token must be rejected.
          if curl -fsS -H 'Content-Type: application/json' \
               -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
               http://localhost:18099/mcp; then
            echo "ERROR: /mcp accepted a request without a token" >&2; exit 1
          fi
          curl -fsS -H 'Content-Type: application/json' \
               -H 'Authorization: Bearer test-token-123' \
               -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
               http://localhost:18099/mcp | python3 -c \
            "import sys, json; tools = json.load(sys.stdin)['result']['tools']; \
             assert len(tools) == 9, tools; print('MCP HTTP tools:', [t['name'] for t in tools])"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: arthas-demo-ci

      - name: Load image and deploy
        run: |
          # The checked-in manifest pins demo-service:0.1.0; retag the CI
          # image to that tag so the manifest needs no CI-only fork.
          docker tag demo-service:ci demo-service:0.1.0
          kind load docker-image demo-service:0.1.0 --name arthas-demo-ci
          # NOTE: this namespace is created only in the throwaway CI kind
          # cluster, never in a real/LAN cluster. Applying the whole k8s/
          # directory in one batch raced namespace creation (deployment
          # failed with "namespaces demo-arthas not found"), so create
          # the namespace first and wait for it to be usable.
          kubectl apply -f k8s/namespace.yaml
          for i in $(seq 1 30); do
            kubectl get namespace demo-arthas >/dev/null 2>&1 && break
            sleep 2
          done
          sleep 5
          kubectl get namespace demo-arthas
          kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml
          kubectl -n demo-arthas rollout status deployment/demo-service --timeout=180s

      - name: Smoke test (health + normal order + fault reset)
        run: |
          kubectl -n demo-arthas port-forward svc/demo-service 8080:8080 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          sleep 3
          curl -fsS http://localhost:8080/actuator/health
          echo
          curl -fsS http://localhost:8080/api/orders/1
          echo
          curl -fsS http://localhost:8080/demo/faults
          echo
          # Leave the cluster clean for the next demo run.
          kubectl -n demo-arthas get pods
