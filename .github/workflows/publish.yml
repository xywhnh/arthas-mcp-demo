name: Publish

# Build the demo image on GitHub and push it to GHCR, so a LAN cluster
# can pull it without building locally. This is separate from CI:
# CI proves the image builds and starts on kind; this job is the only
# one that publishes an image.
#
# Image: ghcr.io/xywhnh/arthas-mcp-demo:0.1.0 (and :latest)
# Platforms: linux/amd64 and linux/arm64, so both x86 and ARM nodes
# (e.g. Oracle A1, Apple Silicon kind, ARM LAN nodes) can pull it.
#
# Visibility: the GHCR package is public (verified 2026-10-28, anonymous
# manifest fetch returns 200 for amd64+arm64), so LAN nodes pull it
# anonymously. If it is ever switched back to private, LAN pulls fail.
on:
  push:
    branches: [main]
    paths:
      - apps/demo-service/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build demo-service jar
        run: mvn -B -pl apps/demo-service -am package -DskipTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: apps/demo-service
          file: apps/demo-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/xywhnh/arthas-mcp-demo:0.1.0
            ghcr.io/xywhnh/arthas-mcp-demo:latest
